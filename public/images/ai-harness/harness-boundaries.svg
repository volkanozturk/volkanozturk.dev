<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750" role="img" aria-labelledby="t d"><title id="t">Harness boundaries</title><desc id="d">A task contract constrains an agent harness, which produces a patch; a separate verifier checks outcomes.</desc><rect width="640" height="750" rx="16" fill="#F7F4EC"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6E6E6A"/></marker></defs><text x="34" y="53" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#2B2C2C" text-anchor="start">From instructions to checkable evidence</text><text x="34" y="82" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5D5D5A" text-anchor="start">The model proposes; the system enforces</text><rect x="40" y="113" width="560" height="85" rx="12" fill="#F7F4EC" stroke="#2B2C2C" stroke-width="2"/><text x="60" y="146" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2B2C2C" text-anchor="start">TASK CONTRACT</text><text x="60" y="176" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5D5D5A" text-anchor="start">Goal  •  scope  •  invariants  •  permissions</text><line x1="320" y1="199" x2="320" y2="229" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="40" y="233" width="560" height="203" rx="12" fill="#E5E1D9" stroke="none" stroke-width="2"/><text x="60" y="268" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#2B2C2C" text-anchor="start">AGENT HARNESS</text><text x="60" y="295" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5D5D5A" text-anchor="start">Controls context, tools and execution</text><rect x="60" y="318" width="245" height="93" rx="12" fill="#F7F4EC" stroke="none" stroke-width="2"/><rect x="335" y="318" width="245" height="93" rx="12" fill="#F7F4EC" stroke="none" stroke-width="2"/><text x="182" y="352" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2B2C2C" text-anchor="middle">Model loop</text><text x="182" y="381" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5D5D5A" text-anchor="middle">Plans and proposes</text><text x="457" y="352" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2B2C2C" text-anchor="middle">Restricted tools</text><text x="457" y="381" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5D5D5A" text-anchor="middle">Runs allowed actions</text><line x1="320" y1="437" x2="320" y2="467" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="40" y="474" width="560" height="77" rx="12" fill="#F7F4EC" stroke="#2B2C2C" stroke-width="2"/><text x="60" y="509" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#2B2C2C" text-anchor="start">CANDIDATE PATCH + TRACE</text><text x="60" y="536" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5D5D5A" text-anchor="start">Not a proof of correctness</text><line x1="320" y1="552" x2="320" y2="581" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="40" y="586" width="560" height="114" rx="12" fill="#EBD4C2" stroke="none" stroke-width="2"/><text x="60" y="621" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#2B2C2C" text-anchor="start">INDEPENDENT VERIFIER</text><text x="60" y="651" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#2B2C2C" text-anchor="start">Changed files  •  protected tests  •  API contract</text><rect x="60" y="667" width="115" height="27" rx="13.5" fill="#A9512E" stroke="none" stroke-width="2"/><text x="117.5" y="687.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#F7F4EC" text-anchor="middle">PASS / FAIL</text></svg>