<svg xmlns="http://www.w3.org/2000/svg" width="640" height="694" viewBox="0 0 640 694" role="img" aria-labelledby="t d"><title id="t">Self-report versus evidence</title><desc id="d">An agent claims success, but trusted CI observes an API-contract failure and rejects the patch.</desc><rect width="640" height="694" rx="16" fill="#F7F4EC"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6E6E6A"/></marker></defs><text x="34" y="53" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2B2C2C" text-anchor="start">A convincing answer is not a passing test</text><text x="34" y="82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5D5D5A" text-anchor="start">Trust observed outcomes, not the final message</text><rect x="40" y="115" width="560" height="132" rx="12" fill="#E5E1D9" stroke="none" stroke-width="2"/><text x="60" y="151" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2B2C2C" text-anchor="start">AGENT MESSAGE</text><text x="60" y="188" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#2B2C2C" text-anchor="start">“Everything passed. Ready to merge.”</text><text x="60" y="222" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#944728" text-anchor="start">Self-report  ≠  independent evidence</text><line x1="320" y1="250" x2="320" y2="285" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="40" y="290" width="560" height="255" rx="12" fill="#F7F4EC" stroke="#2B2C2C" stroke-width="2"/><text x="60" y="326" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2B2C2C" text-anchor="start">TRUSTED RUNNER CHECKS ACTUAL STATE</text><rect x="55" y="346" width="530" height="53" rx="8" fill="#E5E1D9" stroke="none" stroke-width="2"/><text x="73" y="379" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2B2C2C" text-anchor="start">Actual changed files</text><text x="554" y="379" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2B2C2C" text-anchor="end">PASS</text><rect x="55" y="408" width="530" height="53" rx="8" fill="#E5E1D9" stroke="none" stroke-width="2"/><text x="73" y="441" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2B2C2C" text-anchor="start">Protected regression suite</text><text x="554" y="441" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2B2C2C" text-anchor="end">PASS</text><rect x="55" y="470" width="530" height="53" rx="8" fill="#E5E1D9" stroke="none" stroke-width="2"/><text x="73" y="503" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2B2C2C" text-anchor="start">API contract snapshot</text><text x="554" y="503" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#944728" text-anchor="end">FAIL</text><line x1="320" y1="547" x2="320" y2="582" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="40" y="590" width="560" height="66" rx="12" fill="#A9512E" stroke="none" stroke-width="2"/><text x="320" y="633" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F7F4EC" text-anchor="middle">REJECT — contract check failed</text></svg>