<svg xmlns="http://www.w3.org/2000/svg" width="640" height="824" viewBox="0 0 640 824" role="img" aria-labelledby="t d"><title id="t">Verification loop</title><desc id="d">The agent edits a candidate; an independent verifier either rejects and allows bounded repair or passes to review and promotion.</desc><rect width="640" height="824" rx="16" fill="#F7F4EC"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6E6E6A"/></marker></defs><text x="34" y="53" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2B2C2C" text-anchor="start">The verification loop</text><text x="34" y="82" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5D5D5A" text-anchor="start">Accept the checked artifact, not an assertion</text><rect x="40" y="108" width="560" height="69" rx="12" fill="#F7F4EC" stroke="#2B2C2C" stroke-width="2"/><text x="320" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#2B2C2C" text-anchor="middle">Task contract + pinned base revision</text><line x1="320" y1="178" x2="320" y2="210" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="40" y="215" width="560" height="85" rx="12" fill="#E5E1D9" stroke="none" stroke-width="2"/><text x="320" y="251" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#2B2C2C" text-anchor="middle">Restricted agent execution</text><text x="320" y="280" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5D5D5A" text-anchor="middle">Produces candidate patch and trace</text><line x1="320" y1="302" x2="320" y2="335" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="40" y="340" width="560" height="92" rx="12" fill="#F7F4EC" stroke="#2B2C2C" stroke-width="2"/><text x="320" y="376" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#2B2C2C" text-anchor="middle">Independent verification</text><text x="320" y="405" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5D5D5A" text-anchor="middle">Scope  •  build  •  tests  •  contracts</text><line x1="320" y1="433" x2="320" y2="459" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  /><line x1="160" y1="459" x2="480" y2="459" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  /><line x1="160" y1="459" x2="160" y2="486" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><line x1="480" y1="459" x2="480" y2="486" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="40" y="493" width="256" height="110" rx="12" fill="#EBD4C2" stroke="none" stroke-width="2"/><rect x="344" y="493" width="256" height="110" rx="12" fill="#E5E1D9" stroke="none" stroke-width="2"/><text x="168" y="526" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#944728" text-anchor="middle">FAIL</text><text x="168" y="555" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#2B2C2C" text-anchor="middle">Bounded repair</text><text x="168" y="582" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#2B2C2C" text-anchor="middle">or escalation</text><text x="472" y="526" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#2B2C2C" text-anchor="middle">PASS</text><text x="472" y="555" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#2B2C2C" text-anchor="middle">Review and</text><text x="472" y="582" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#2B2C2C" text-anchor="middle">approval gate</text><path d="M78 604 V653 H24 V258 H36" stroke="#A9512E" stroke-width="3" fill="none" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="55" y="689" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#5D5D5A" text-anchor="start">Repair loop has a fixed attempt budget</text><line x1="472" y1="604" x2="472" y2="723" stroke="#6E6E6A" stroke-width="3" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="210" y="728" width="390" height="65" rx="12" fill="#2B2C2C" stroke="none" stroke-width="2"/><text x="405" y="770" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F7F4EC" text-anchor="middle">Promote the same checked artifact</text></svg>