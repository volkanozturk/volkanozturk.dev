<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="640" height="410" fill="#f5f1e8"/>
<text x="32" y="48" font-size="30" font-weight="700" fill="#30312e">A score is not a decision</text>
<text x="32" y="80" font-size="21" fill="#5c5a54">Illustrative policy zones; boundaries need validation</text>
<rect x="32.0" y="108" width="186.7" height="132" rx="14" fill="#dcdad4"/>
<text x="125.3" y="160" text-anchor="middle" font-size="25" font-weight="700" fill="#30312e">NO MATCH</text>
<text x="125.3" y="194" text-anchor="middle" font-size="21" fill="#5c5a54">Insufficient</text>
<text x="125.3" y="220" text-anchor="middle" font-size="21" fill="#5c5a54">evidence</text>
<rect x="226.7" y="108" width="186.7" height="132" rx="14" fill="#ecd3c0"/>
<text x="320.0" y="160" text-anchor="middle" font-size="25" font-weight="700" fill="#30312e">REVIEW</text>
<text x="320.0" y="194" text-anchor="middle" font-size="21" fill="#5c5a54">Uncertain</text>
<text x="320.0" y="220" text-anchor="middle" font-size="21" fill="#5c5a54">evidence</text>
<rect x="421.3" y="108" width="186.7" height="132" rx="14" fill="#9e4c27"/>
<text x="514.7" y="160" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">MATCH</text>
<text x="514.7" y="194" text-anchor="middle" font-size="21" fill="#ffffff">Policy criteria</text>
<text x="514.7" y="220" text-anchor="middle" font-size="21" fill="#ffffff">met</text>
<path d="M32 272 H596" stroke="#77766f" stroke-width="3"/>
<path d="M594 263 L608 272 L594 281 Z" fill="#77766f"/>
<text x="32" y="306" font-size="21" fill="#5c5a54">Lower similarity</text>
<text x="608" y="306" text-anchor="end" font-size="21" fill="#5c5a54">Higher similarity</text>
<text x="32" y="354" font-size="21" fill="#30312e">Not a probability scale. This diagram does not</text>
<text x="32" y="382" font-size="21" fill="#30312e">recommend any numeric thresholds.</text>
</svg>
