<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="640" height="780" fill="#f5f1e8"/>
<text x="32" y="48" font-size="30" font-weight="700" fill="#30312e">From name strings to a decision</text>
<text x="32" y="80" font-size="21" fill="#5c5a54">Representation, comparison and policy stay separate</text>
<rect x="32" y="104" width="576" height="56" rx="12" fill="#f5f1e8" stroke="#c4bdaf" stroke-width="2"/>
<text x="54" y="140" font-size="24" font-weight="700" fill="#30312e">Input</text>
<text x="586" y="140" text-anchor="end" font-size="21" fill="#5c5a54">two name records</text>
<path d="M320 160 V177" stroke="#77766f" stroke-width="3"/>
<path d="M312 175 L320 185 L328 175 Z" fill="#77766f"/>
<rect x="32" y="186" width="576" height="56" rx="12" fill="#e6e1d7"/>
<text x="54" y="222" font-size="24" font-weight="700" fill="#30312e">Validation</text>
<text x="586" y="222" text-anchor="end" font-size="21" fill="#5c5a54">missing or malformed input</text>
<path d="M320 242 V259" stroke="#77766f" stroke-width="3"/>
<path d="M312 257 L320 267 L328 257 Z" fill="#77766f"/>
<rect x="32" y="268" width="576" height="56" rx="12" fill="#e6e1d7"/>
<text x="54" y="304" font-size="24" font-weight="700" fill="#30312e">Normalization</text>
<text x="586" y="304" text-anchor="end" font-size="21" fill="#5c5a54">comparison copies</text>
<path d="M320 324 V341" stroke="#77766f" stroke-width="3"/>
<path d="M312 339 L320 349 L328 339 Z" fill="#77766f"/>
<rect x="32" y="350" width="576" height="56" rx="12" fill="#e6e1d7"/>
<text x="54" y="386" font-size="24" font-weight="700" fill="#30312e">Name interpretation</text>
<text x="586" y="386" text-anchor="end" font-size="21" fill="#5c5a54">structure and order</text>
<path d="M320 406 V423" stroke="#77766f" stroke-width="3"/>
<path d="M312 421 L320 431 L328 421 Z" fill="#77766f"/>
<rect x="32" y="432" width="576" height="56" rx="12" fill="#e6e1d7"/>
<text x="54" y="468" font-size="24" font-weight="700" fill="#30312e">Comparison</text>
<text x="586" y="468" text-anchor="end" font-size="21" fill="#5c5a54">exact, alias, fuzzy</text>
<path d="M320 488 V505" stroke="#77766f" stroke-width="3"/>
<path d="M312 503 L320 513 L328 503 Z" fill="#77766f"/>
<rect x="32" y="514" width="576" height="56" rx="12" fill="#e6e1d7"/>
<text x="54" y="550" font-size="24" font-weight="700" fill="#30312e">Evidence aggregation</text>
<text x="586" y="550" text-anchor="end" font-size="21" fill="#5c5a54">combine signals</text>
<path d="M320 570 V587" stroke="#77766f" stroke-width="3"/>
<path d="M312 585 L320 595 L328 585 Z" fill="#77766f"/>
<rect x="32" y="596" width="576" height="56" rx="12" fill="#9e4c27"/>
<text x="54" y="632" font-size="24" font-weight="700" fill="#ffffff">Decision</text>
<text x="586" y="632" text-anchor="end" font-size="21" fill="#ffffff">versioned policy rules</text>
<path d="M320 652 V672 M125 672 H515" stroke="#77766f" stroke-width="3" fill="none"/>
<path d="M125 672 V691" stroke="#77766f" stroke-width="3"/>
<path d="M117 689 L125 699 L133 689 Z" fill="#77766f"/>
<rect x="35" y="700" width="180" height="52" rx="26" fill="#dcdad4"/>
<text x="125" y="734" text-anchor="middle" font-size="22" font-weight="700" fill="#30312e">NO MATCH</text>
<path d="M320 672 V691" stroke="#77766f" stroke-width="3"/>
<path d="M312 689 L320 699 L328 689 Z" fill="#77766f"/>
<rect x="230" y="700" width="180" height="52" rx="26" fill="#ecd3c0"/>
<text x="320" y="734" text-anchor="middle" font-size="22" font-weight="700" fill="#30312e">REVIEW</text>
<path d="M515 672 V691" stroke="#77766f" stroke-width="3"/>
<path d="M507 689 L515 699 L523 689 Z" fill="#77766f"/>
<rect x="425" y="700" width="180" height="52" rx="26" fill="#9e4c27"/>
<text x="515" y="734" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">MATCH</text>
</svg>
