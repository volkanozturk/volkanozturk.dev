<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="660px" version="1.1" viewBox="0 0 640 660" width="640px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F6F2EA" height="660" rx="18" width="640" x="0" y="0" /><text fill="#292B2B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="30" y="52">Should we retry this request?</text><text fill="#74736E" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="30" y="83">Any failed guard means STOP, not another attempt</text><rect fill="#FEFCF8" height="82" rx="16" stroke="none" stroke-width="2" width="530" x="55" y="112" /><text fill="#292B2B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="320" y="146">Failure observed</text><text fill="#74736E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="320" y="176">Classify the outcome</text><line stroke="#AF542C" stroke-width="3" x1="320" x2="320" y1="195" y2="209" /><polygon fill="#AF542C" points="320,209 326.0,198.0 314.0,198.0" /><rect fill="#EDC8B1" height="82" rx="16" stroke="none" stroke-width="2" width="530" x="55" y="214" /><text fill="#292B2B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="320" y="248">Retryable and safe to replay?</text><text fill="#74736E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="320" y="278">Classify failure + idempotency</text><line stroke="#AF542C" stroke-width="3" x1="320" x2="320" y1="297" y2="311" /><polygon fill="#AF542C" points="320,311 326.0,300.0 314.0,300.0" /><rect fill="#FEFCF8" height="82" rx="16" stroke="none" stroke-width="2" width="530" x="55" y="316" /><text fill="#292B2B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="320" y="350">Still allowed?</text><text fill="#74736E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="320" y="380">Attempts, deadline, shared budget</text><line stroke="#AF542C" stroke-width="3" x1="320" x2="320" y1="399" y2="413" /><polygon fill="#AF542C" points="320,413 326.0,402.0 314.0,402.0" /><rect fill="#FEFCF8" height="82" rx="16" stroke="none" stroke-width="2" width="530" x="55" y="418" /><text fill="#292B2B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="320" y="452">Schedule responsibly</text><text fill="#74736E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="320" y="482">Backoff + jitter + Retry-After</text><line stroke="#AF542C" stroke-width="3" x1="320" x2="320" y1="501" y2="515" /><polygon fill="#AF542C" points="320,515 326.0,504.0 314.0,504.0" /><rect fill="#292B2B" height="82" rx="16" stroke="none" stroke-width="2" width="530" x="55" y="520" /><text fill="#FEFCF8" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="320" y="554">Next attempt</text><text fill="#FEFCF8" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="320" y="584">Only while useful</text><text fill="#74736E" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="320" y="637">NO at any check → STOP</text></svg>