<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- No-JS fallback: always land on the default locale. -->
    <meta http-equiv="refresh" content="0; url=/en/" />
    <link rel="canonical" href="https://volkanozturk.dev/en/" />
    <title>Volkan Öztürk</title>
    <script>
      // `output: 'export'` means Next.js middleware never runs, so the locale
      // negotiation for "/" happens here instead.
      (function () {
        var supported = ['en', 'tr', 'nl'];
        var preferred = navigator.languages || [navigator.language || 'en'];
        var target = 'en';

        for (var i = 0; i < preferred.length; i++) {
          var base = String(preferred[i]).toLowerCase().split('-')[0];
          if (supported.indexOf(base) !== -1) {
            target = base;
            break;
          }
        }

        location.replace('/' + target + '/');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/en/">volkanozturk.dev</a>…</p>
  </body>
</html>
